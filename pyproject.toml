[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fda-drug-retrieval"
version = "0.1.0"
description = "Provenance-preserving FDA label retrieval and reproducible evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests==2.32.5", "python-dotenv==1.2.2", "numpy>=1.26,<3",
  "chromadb>=1.0,<2", "tiktoken>=0.9,<1", "sentence-transformers==3.0.1",
  "transformers==4.40.1", "torch>=2.2,<3",
  "fastapi>=0.115,<1", "pydantic[email]>=2.7,<3", "uvicorn>=0.30,<1",
  "pwdlib[argon2]>=0.2,<1", "httpx>=0.27,<1", "streamlit>=1.50,<2"
]
[project.optional-dependencies]
research = [
  "pandas==2.3.3", "matplotlib==3.10.8", "nbformat==5.10.4",
  "nbclient==0.10.4", "ipykernel>=6,<8"
]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
[project.scripts]
fda-rag = "src.cli:main"
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: explicit opt-in integration checks requiring external services or models"]
[tool.ruff]
line-length = 110
target-version = "py311"
