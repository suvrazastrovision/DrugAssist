name: Offline tests

on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --locked --no-sync ruff check src tests scripts frontend
      - run: uv run --locked --no-sync python scripts/test_clean.py
